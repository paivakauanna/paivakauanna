<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="84" viewBox="0 0 1000 84"><defs><linearGradient id="neon" x1="0" x2="1"><stop offset="0" stop-color="#a855f7"/><stop offset=".6" stop-color="#f472b6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
