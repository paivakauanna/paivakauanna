.pulse{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:.35}50%{opacity:1}}
.flow{stroke-dasharray:6 10;animation:fl 1.6s linear infinite}@keyframes fl{to{stroke-dashoffset:-32}}
