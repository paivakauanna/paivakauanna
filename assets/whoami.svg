<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>
.mono{font-family:'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace}
.disp{font-family:'Arial Black','Arial Bold',Impact,'Helvetica Neue',sans-serif;font-weight:900}
.bl{animation:bl 1.1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.scan{animation:scan 5s linear infinite}@keyframes scan{0%{transform:translateY(-60px)}100%{transform:translateY(500px)}}
.g1{animation:g1 3.4s infinite steps(1)}@keyframes g1{0%,86%,100%{transform:translate(-3px,0)}88%{transform:translate(-9px,2px)}92%{transform:translate(4px,-2px)}}
.g2{animation:g2 3.4s infinite steps(1)}@keyframes g2{0%,86%,100%{transform:translate(3px,0)}89%{transform:translate(10px,-1px)}93%{transform:translate(-5px,2px)}}
.rot{transform-box:fill-box;transform-origin:center;animation:rot 14s linear infinite}
.rotr{transform-box:fill-box;transform-origin:center;animation:rot 9s linear infinite reverse}
@keyframes rot{to{transform:rotate(360deg)}}
.pulse{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:.35}50%{opacity:1}}
.flow{stroke-dasharray:6 10;animation:fl 1.6s linear infinite}@keyframes fl{to{stroke-dashoffset:-32}}
